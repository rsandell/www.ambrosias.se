<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} - {{ .Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <link rel="icon" href="{{ "img/logo-small.png" | relURL }}">
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main" class="page">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    (function () {
      var b = document.querySelector('.menu-toggle'), n = document.getElementById('site-nav');
      if (!b || !n) return;
      b.addEventListener('click', function () {
        var open = n.classList.toggle('open');
        b.setAttribute('aria-expanded', open);
      });
    })();
  </script>
</body>
</html>
